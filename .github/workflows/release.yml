name: Publish to crates.io
on:
  push:
    tags: ['v*']
jobs:
  publish:
    if: ${{ github.repository_owner == 'DavidRL77' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - uses: rust-lang/crates-io-auth-action@v1
      id: auth
    - run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
