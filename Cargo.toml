[package]
name = "booru-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
booru-rs = { version = "0.3.1", features = ["rule34", "gelbooru"] }
clap = { version = "4.6.6", features = ["derive", "string"] }
dirs = "6.0.0"
serde = "1.0.229"
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.4"
