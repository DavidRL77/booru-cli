[package]
name = "booru-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
booru-rs = { version = "1", features = ["rule34", "gelbooru", "safebooru", "download"], default-features = false }
clap = { version = "4.6.6", features = ["derive", "string"] }
dirs = "6.0.0"
reqwest = "0.12"
serde = "1.0.229"
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.4"
