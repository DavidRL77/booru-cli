[package]
name = "booru-cli"
version = "0.2.0"
edition = "2024"
rust-version="1.93"
description="Command line tool to interact with various booru APIs."
readme="README.md"
repository="https://github.com/DavidRL77/booru-cli"
license="MIT"

[dependencies]
anyhow = "1.0.104"
booru-rs = { git = "https://github.com/ajiiisai/booru-rs", features = ["rule34", "gelbooru", "safebooru", "download", "konachan"], default-features = false }
clap = { version = "4.6.6", features = ["derive", "string", "cargo"] }
dirs = "6.0.0"
reqwest = "0.12"
serde = "1.0.229"
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.4"
